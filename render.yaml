services:
  - type: web
    name: rolo-pantich-bot
    env: node
    plan: free
    rootDir: bot
    buildCommand: npm ci
    startCommand: node rolo-bot.js
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_IDS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WORKER_URL
        value: https://sparkling-lake-e9b6.repantich.workers.dev
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
